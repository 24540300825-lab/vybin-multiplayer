<!doctype html>
<!-- Bake decal cỏ / cây từ FILE_FOLIAGE_DECAL.glb: 2 lượt render chính diện (orthographic)
     • pass "alb": RGB = màu (thân gỗ: màu texture thật; lá/cỏ: độ sáng xám để game tự tô theo bảng màu cỏ cây), A = độ phủ
     • pass "nrm": RGB = normal theo trục tiếp tuyến của tấm (x phải, y lên, z hướng camera), A = mặt nạ lá/cỏ (1) hay thân (0)
     Chạy: mở tools/bake/index.html?w=..&h=..&what=grass|pine|round1|round2&pass=alb|nrm (headless, xem tools/bake/bake.cjs) -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search), W = +q.get('w') || 1024, H = +q.get('h') || 256, what = q.get('what') || 'grass', pass = q.get('pass') || 'alb';
const R = new THREE.WebGLRenderer({antialias: true, alpha: true, preserveDrawingBuffer: true}); R.setPixelRatio(1); R.setSize(W, H); R.setClearColor(0, 0); document.body.appendChild(R.domElement);
R.outputColorSpace = THREE.LinearSRGBColorSpace;   // xuất giá trị thô (texture đọc NoColorSpace) → PNG đúng như ảnh gốc
const scene = new THREE.Scene();
const g = await new GLTFLoader().loadAsync('foliage_decal.glb');
const mask = await new THREE.TextureLoader().loadAsync('../../assets/grass-mask.png'); mask.flipY = false; mask.colorSpace = THREE.NoColorSpace;
let rs = 9; const rnd = () => (rs = (rs * 16807) % 2147483647) / 2147483647;
const VS = `varying vec3 vN,vS;varying vec2 vU;varying float vY;uniform vec3 uC,uCR;
  void main(){vU=uv;vec4 w=modelMatrix*vec4(position,1.0);vY=w.y;vN=normalize(mat3(viewMatrix*modelMatrix)*normal);vS=mat3(viewMatrix)*((w.xyz-uC)/uCR);gl_Position=projectionMatrix*viewMatrix*w;}`;
const FS = `uniform sampler2D uMap,uMask;uniform float uLeaf,uHasMap,uHasMask,uPass,uY0,uY1,uSph;uniform vec3 uC,uCR;varying vec3 vN,vS;varying vec2 vU;varying float vY;
  void main(){
    if(uHasMask>0.5&&texture2D(uMask,vU).r<0.4)discard;
    vec3 n=normalize(vN);if(!gl_FrontFacing)n=-n;if(n.z<0.0)n.z=-n.z*0.35;n=normalize(n);   // mặt quay lưng: lật về phía camera (lá 2 mặt)
    // lá/cỏ: normal = khối tán (cầu quanh tâm tán / hướng lên-ra cho cỏ) trộn 1 phần normal từng tấm lá → toon nhận nắng mượt như khối thật, vẫn có vân lá
    vec3 sp=normalize(vS+vec3(0.0,0.0,0.55));vec3 bn=uSph>0.5?sp:normalize(vec3(0.0,0.62,0.78));
    if(uLeaf>0.5)n=normalize(mix(bn,n,0.32));
    if(uPass>0.5){gl_FragColor=vec4(n*0.5+0.5,uLeaf);return;}
    float h=clamp((vY-uY0)/max(uY1-uY0,0.001),0.0,1.0);
    vec3 c;
    if(uLeaf>0.5){float ao=uSph>0.5?smoothstep(-0.2,0.9,length(vS)):1.0;float l=(0.22+0.45*h+0.33*(0.5+0.5*dot(n,normalize(vec3(0.2,0.9,0.4)))))*mix(0.62,1.0,ao);c=vec3(clamp(l,0.0,1.0));}
    else c=uHasMap>0.5?texture2D(uMap,vU).rgb:vec3(0.42,0.3,0.2);
    gl_FragColor=vec4(c,1.0);}`;
const mats = new Map();
function matFor(m, leaf, y0, y1) {
  const k = m.uuid + leaf; if (mats.has(k)) return mats.get(k);
  const map = m.map || null; if (map) map.colorSpace = THREE.NoColorSpace;
  const grass = /Plant_01/.test(m.name);
  const sm = new THREE.ShaderMaterial({vertexShader: VS, fragmentShader: FS, side: THREE.DoubleSide,
    uniforms: {uC: {value: CC}, uCR: {value: CR}, uSph: {value: what === 'grass' ? 0 : 1}, uMap: {value: map}, uMask: {value: mask}, uLeaf: {value: leaf ? 1 : 0}, uHasMap: {value: map ? 1 : 0}, uHasMask: {value: grass ? 1 : 0}, uPass: {value: pass === 'nrm' ? 1 : 0}, uY0: {value: y0}, uY1: {value: y1}}});
  mats.set(k, sm); return sm;
}
const byName = n => g.scene.getObjectByName(n);
const nodeOf = {pine: 'TREE_PROTOTYPE', round1: 'TREE_ROUND', round2: 'TREE_ROUND_2'};
let box = new THREE.Box3();
if (what === 'grass') {
  const proto = byName('GRASS_PROTOTYPE'); proto.position.set(0, 0, 0); proto.updateMatrixWorld(true);
  const b0 = new THREE.Box3().setFromObject(proto);
  // dải cỏ um tùm: nhiều cụm xoay/scale ngẫu nhiên xếp 3 hàng so le, chân sát mặt đất
  // bụi cỏ to nhỏ không đều, có chỗ hở → bóng dáng mép trên lô nhô tự nhiên (không thành 'hàng rào' phẳng đỉnh)
  const N = 36, half = 4.0;
  for (let i = 0; i < N; i++) {
    const c = proto.clone(); const s = 0.42 + Math.pow(rnd(), 1.6) * 0.95; c.scale.set(s * (0.8 + rnd() * 0.5), s, s * (0.8 + rnd() * 0.5));
    c.rotation.y = rnd() * Math.PI * 2; c.position.set(-half + 0.5 + rnd() * (2 * half - 1.0), -b0.min.y * s, -1.4 + rnd() * 2.8);
    scene.add(c);
  }
  scene.updateMatrixWorld(true); box.setFromObject(scene);
} else {
  const t = byName(nodeOf[what]); t.position.set(0, 0, 0); t.updateMatrixWorld(true); scene.add(t); scene.updateMatrixWorld(true); box.setFromObject(scene);
}
const y0 = box.min.y, y1 = box.max.y;
// tâm + bán kính tán lá (để dựng normal khối)
const lb = new THREE.Box3(); scene.traverse(o => { if (o.isMesh && /Leaves/.test(o.material.name)) lb.expandByObject(o); });
const CC = lb.isEmpty() ? new THREE.Vector3() : lb.getCenter(new THREE.Vector3()), CR = lb.isEmpty() ? new THREE.Vector3(1, 1, 1) : lb.getSize(new THREE.Vector3()).multiplyScalar(0.5);
scene.traverse(o => { if (!o.isMesh) return; const leaf = /Plant_01|Leaves/.test(o.material.name); o.material = matFor(o.material, leaf, y0, y1); });
// khung ortho: chân = đáy ảnh; giữ đúng tỉ lệ ảnh W:H, căn giữa ngang
const asp = W / H, bw = box.max.x - box.min.x, bh = box.max.y - box.min.y;
let fh = bh * 1.02, fw = fh * asp; if (fw < bw * 1.02) { fw = bw * 1.02; fh = fw / asp; }
if (what === 'grass') { fw = 8.0; fh = fw / asp; }
const cx = what === 'grass' ? 0 : (box.min.x + box.max.x) / 2;
const cam = new THREE.OrthographicCamera(-fw / 2, fw / 2, fh, 0, 0.1, 200);
cam.position.set(cx, box.min.y, 60); cam.lookAt(cx, box.min.y, 0);
R.render(scene, cam);
window.__info = {fw, fh, bw, bh, y0, cx, bx0: box.min.x, bx1: box.max.x};
window.__done = true;
</script></body></html>
